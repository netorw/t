<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f4f8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f131a" media="(prefers-color-scheme: dark)">
<title>排班与考勤</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f2f4f8; --card: #fff; --text: #1a1f2c; --muted: #6e7687; --line: #e4e7ef;
  --accent: #2554c7; --ring: #111827; --inner: #fff;
  --early-bg: #e0f2fe; --early-fg: #0369a1;
  --mid-bg: #ffedd5;   --mid-fg: #c2410c;
  --night-bg: #312e81; --night-fg: #e0e7ff;
  --rest-bg: #d1fae5;  --rest-fg: #047857;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f131a; --card: #181e29; --text: #e5e9f0; --muted: #8b95a7; --line: #283142;
    --accent: #3b82f6; --ring: #f8fafc; --inner: #181e29;
    --early-bg: #112a45; --early-fg: #7dd3fc;
    --mid-bg: #3b2110;   --mid-fg: #fdba74;
    --night-bg: #2e1d4a; --night-fg: #d8b4fe;
    --rest-bg: #0d3326;  --rest-fg: #6ee7b7;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
.wrap { width: min(100%, 540px); margin: 0 auto; padding: 12px 10px calc(24px + env(safe-area-inset-bottom)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 13px 12px; margin-bottom: 10px; box-shadow: 0 2px 10px rgba(0,0,0,.06); }
.row-between { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero-date { font-size: 13px; color: var(--muted); margin-bottom: 2px; font-weight: 500; }
.hero-title { font-size: 20px; font-weight: 800; }
.hero-badge { padding: 8px 16px; border-radius: 12px; font-size: 16px; font-weight: 800; white-space: nowrap; }
.picked-bar { margin-top: 9px; padding-top: 9px; border-top: 1px dashed var(--line); font-size: 13px; color: var(--muted); }
.picked-bar strong { color: var(--text); }
.month-wrap { position: relative; display: inline-flex; align-items: center; }
.month-title { font-size: 20px; font-weight: 800; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.month-title::after { content: "▾"; font-size: 13px; color: var(--muted); }
.month-picker { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; border: 0; }
.nav { display: flex; gap: 5px; align-items: center; }
button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 34px; }
button:active { transform: scale(.97); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.iconbtn { padding: 4px 11px; font-size: 18px; line-height: 1; }
.weekdays, .calendar { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
.weekdays { margin-top: 10px; }
.weekday { text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; padding: 2px 0 6px; }
.day { position: relative; min-height: 58px; border-radius: 11px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; padding: 4px 1px; cursor: pointer; user-select: none; border: 1.5px solid transparent; }
.day:active { transform: scale(.95); }
.day .num { font-size: 15px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.day .shift { font-size: 12px; font-weight: 800; line-height: 1.1; }
.day.early { background: var(--early-bg); color: var(--early-fg); }
.day.mid   { background: var(--mid-bg);   color: var(--mid-fg); }
.day.night { background: var(--night-bg); color: var(--night-fg); }
.day.rest  { background: var(--rest-bg);  color: var(--rest-fg); }
.day.outside { opacity: .26; filter: grayscale(40%); }
.day.today { border: 2px solid var(--ring); box-shadow: 0 0 0 1.5px var(--inner) inset; }
.day.today::after { content: "今"; position: absolute; top: 2px; right: 2px; font-size: 9px; line-height: 13px; height: 13px; min-width: 13px; border-radius: 99px; text-align: center; background: var(--ring); color: var(--inner); font-weight: 800; }
.day.selected:not(.today) { border: 2px dashed var(--accent); }
.section-title { font-size: 15px; font-weight: 800; margin: 0; }
.attendance { margin-top: 9px; font-size: 13.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 11px; padding: 10px 12px; user-select: text; -webkit-user-select: text; font-variant-numeric: tabular-nums; }
details summary { cursor: pointer; font-weight: 750; font-size: 14px; color: var(--muted); }
details[open] summary { margin-bottom: 12px; color: var(--text); }
label { display: block; font-size: 12.5px; color: var(--muted); margin: 8px 0 5px; }
input[type="date"] { width: 100%; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 9px 11px; font: inherit; font-size: 15px; color: var(--text); min-height: 40px; }
.actions { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
.hint { font-size: 12px; color: var(--muted); line-height: 1.45; margin: 8px 0 0; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--text); color: var(--card); padding: 9px 15px; border-radius: 99px; font-size: 13px; font-weight: 600; box-shadow: 0 5px 18px rgba(0,0,0,.35); z-index: 10; max-width: calc(100vw - 28px); text-align: center; }
.hidden { display: none; }
@media (max-width: 370px) {
  .wrap { padding-left: 7px; padding-right: 7px; }
  .weekdays, .calendar { gap: 3.5px; }
  .day { min-height: 53px; border-radius: 9px; }
  .day .num { font-size: 14px; }
  .day .shift { font-size: 11px; }
}
</style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="row-between">
      <div>
        <div class="hero-date" id="todayDate"></div>
        <div class="hero-title" id="todayShift"></div>
      </div>
      <div class="hero-badge" id="todayPill"></div>
    </div>
    <div class="picked-bar hidden" id="pickedBar"><span id="pickedText"></span></div>
  </section>

  <section class="card">
    <div class="row-between">
      <div class="month-wrap">
        <div class="month-title" id="monthTitle"></div>
        <input type="month" class="month-picker" id="monthPicker" aria-label="选择年月">
      </div>
      <div class="nav">
        <button class="iconbtn" id="prevMonth" aria-label="上个月">‹</button>
        <button class="iconbtn" id="nextMonth" aria-label="下个月">›</button>
        <button class="primary" id="goToday">今天</button>
      </div>
    </div>
    <div class="weekdays">
      <div class="weekday">一</div><div class="weekday">二</div><div class="weekday">三</div>
      <div class="weekday">四</div><div class="weekday">五</div><div class="weekday">六</div><div class="weekday">日</div>
    </div>
    <div class="calendar" id="calendar"></div>
  </section>

  <section class="card">
    <div class="row-between">
      <h2 class="section-title" id="attendanceTitle"></h2>
      <button class="primary" id="copyAttendance">复制考勤统计</button>
    </div>
    <div class="attendance" id="attendanceText"></div>
  </section>

  <section class="card">
    <details id="settings">
      <summary>排班设置与导出（8天循环：早早中中夜夜休休）</summary>
      <label for="anchorDate">循环第一天（第 1 天早班）</label>
      <input type="date" id="anchorDate" value="2026-10-21">
      <div class="actions">
        <button class="primary" id="saveAnchor">保存起始日期</button>
        <button id="resetAnchor">恢复默认</button>
        <button id="exportHtml">导出此排班 HTML</button>
      </div>
      <p class="hint">自己调日期测试后可点“恢复默认”还原。点“导出此排班 HTML”会生成一份将当前所选日期作为默认值的独立网页，发给同事直接点开就能用。</p>
    </details>
  </section>
</div>
<div id="toast" class="toast hidden" role="status"></div>

<script id="mainScript">
(() => {
  "use strict";
  const DEFAULT_ANCHOR = "2026-10-21"; // __ANCHOR__
  const STORAGE_KEY = "shiftCal.v2." + DEFAULT_ANCHOR;
  const WEEKS = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
  const TYPES = [
    { name: "早", full: "早班", cls: "early" },
    { name: "中", full: "中班", cls: "mid" },
    { name: "夜", full: "夜班", cls: "night" },
    { name: "休", full: "休息", cls: "rest" }
  ];
  const $ = id => document.getElementById(id);
  let anchorISO = DEFAULT_ANCHOR;
  const now = new Date();
  let shownYear = now.getFullYear(), shownMonth = now.getMonth(), selectedISO = null, toastTimer;

  const localISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
  const dayNum = d => Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  const shiftFor = d => TYPES[Math.floor((((dayNum(d) - dayNum(parseISO(anchorISO))) % 8 + 8) % 8) / 2)];
  const fmtDate = d => `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;

  function showToast(msg) {
    const el = $("toast");
    el.textContent = msg;
    el.classList.remove("hidden");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add("hidden"), 2200);
  }

  function loadSettings() {
    try {
      const cfg = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (cfg && /^\d{4}-\d{2}-\d{2}$/.test(cfg.anchorDate)) anchorISO = cfg.anchorDate;
    } catch (_) {}
    $("anchorDate").value = anchorISO;
    $("resetAnchor").textContent = `恢复默认 (${DEFAULT_ANCHOR})`;
  }

  function persistSettings() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ anchorDate: anchorISO })); } catch (_) {}
  }

  function renderPickedInfo() {
    const bar = $("pickedBar"), todayISO = localISO(new Date());
    if (!selectedISO || selectedISO === todayISO) return bar.classList.add("hidden");
    const d = parseISO(selectedISO), s = shiftFor(d), diff = dayNum(d) - dayNum(new Date());
    $("pickedText").innerHTML = `选中日期：<strong>${fmtDate(d)}（${WEEKS[d.getDay()]}）· ${s.full}</strong>（${diff > 0 ? diff + " 天后" : Math.abs(diff) + " 天前"}）`;
    bar.classList.remove("hidden");
  }

  function renderToday() {
    const d = new Date(), s = shiftFor(d), pill = $("todayPill");
    $("todayDate").textContent = `今天 · ${fmtDate(d)}（${WEEKS[d.getDay()]}）`;
    $("todayShift").textContent = `今天是${s.full}`;
    pill.textContent = s.full;
    pill.style.background = `var(--${s.cls}-bg)`;
    pill.style.color = `var(--${s.cls}-fg)`;
    renderPickedInfo();
  }

  function renderCalendar() {
    const ymTitle = `${shownYear}年${shownMonth+1}月`;
    $("monthTitle").textContent = ymTitle;
    $("monthPicker").value = `${shownYear}-${String(shownMonth+1).padStart(2,"0")}`;
    const grid = $("calendar");
    grid.innerHTML = "";
    const first = new Date(shownYear, shownMonth, 1, 12);
    const offset = (first.getDay() + 6) % 7;
    const start = new Date(shownYear, shownMonth, 1 - offset, 12);
    const todayISO = localISO(new Date());
    const daysInMonth = new Date(shownYear, shownMonth + 1, 0, 12).getDate();
    const totalCells = offset + daysInMonth > 35 ? 42 : 35;

    for (let i = 0; i < totalCells; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i, 12);
      const iso = localISO(d), inMonth = d.getMonth() === shownMonth, s = shiftFor(d);
      const cell = document.createElement("div");
      cell.className = `day ${s.cls}${inMonth ? "" : " outside"}${iso === todayISO ? " today" : ""}${iso === selectedISO ? " selected" : ""}`;
      cell.innerHTML = `<span class="num">${d.getDate()}</span><span class="shift">${s.name}</span>`;
      cell.addEventListener("click", () => {
        selectedISO = selectedISO === iso ? null : iso;
        if (!inMonth) { shownYear = d.getFullYear(); shownMonth = d.getMonth(); }
        renderCalendar();
        renderPickedInfo();
      });
      grid.appendChild(cell);
    }

    // 考勤统计计算
    $("attendanceTitle").textContent = `${ymTitle} 考勤统计`;
    const ranges = [];
    let rStart = null, prev = null, workDays = 0;
    for (let day = 1; day <= daysInMonth; day++) {
      const d = new Date(shownYear, shownMonth, day, 12), working = shiftFor(d).cls !== "rest";
      if (working) {
        workDays++;
        if (!rStart) rStart = d;
        prev = d;
      } else if (rStart) {
        ranges.push([rStart, prev]);
        rStart = null;
      }
    }
    if (rStart) ranges.push([rStart, prev]);

    const lines = [`${ymTitle}考勤统计`, "出勤日期："];
    if (ranges.length) {
      ranges.forEach(([a, b]) => {
        const sA = `${a.getMonth()+1}月${a.getDate()}日`, sB = `${b.getMonth()+1}月${b.getDate()}日`;
        const span = dayNum(b) - dayNum(a) + 1;
        lines.push(sA === sB ? `${sA}（1天）` : `${sA}—${sB}（${span}天）`);
      });
    } else {
      lines.push("本月无出勤日期");
    }
    lines.push(`共计出勤 ${workDays} 天`);
    $("attendanceText").textContent = lines.join("\n");
  }

  function renderAll() { renderToday(); renderCalendar(); }

  function validInput() {
    const v = $("anchorDate").value;
    return (/^\d{4}-\d{2}-\d{2}$/.test(v) && localISO(parseISO(v)) === v) ? v : null;
  }

  $("prevMonth").addEventListener("click", () => { if (--shownMonth < 0) { shownMonth = 11; shownYear--; } renderCalendar(); });
  $("nextMonth").addEventListener("click", () => { if (++shownMonth > 11) { shownMonth = 0; shownYear++; } renderCalendar(); });
  $("goToday").addEventListener("click", () => { const d = new Date(); shownYear = d.getFullYear(); shownMonth = d.getMonth(); selectedISO = null; renderAll(); });
  $("monthPicker").addEventListener("change", e => {
    if (/^\d{4}-\d{2}$/.test(e.target.value)) {
      const [y, m] = e.target.value.split("-").map(Number);
      shownYear = y; shownMonth = m - 1; renderCalendar();
    }
  });

  $("saveAnchor").addEventListener("click", () => {
    const v = validInput();
    if (!v) return showToast("请选择有效的循环第一天");
    anchorISO = v; persistSettings(); renderAll(); showToast("循环第一天已保存");
  });

  $("resetAnchor").addEventListener("click", () => {
    anchorISO = DEFAULT_ANCHOR; $("anchorDate").value = DEFAULT_ANCHOR;
    try { localStorage.removeItem(STORAGE_KEY); } catch (_) {}
    renderAll(); showToast(`已恢复默认起始日期 (${DEFAULT_ANCHOR})`);
  });

  $("exportHtml").addEventListener("click", () => {
    const v = validInput();
    if (!v) return showToast("请先选择有效的循环第一天");
    anchorISO = v; persistSettings(); renderAll();

    const clone = document.documentElement.cloneNode(true);
    ["calendar", "todayDate", "todayShift", "todayPill", "monthTitle", "attendanceTitle", "attendanceText", "pickedText", "toast"].forEach(id => {
      const el = clone.querySelector("#" + id);
      if (el) { el.innerHTML = ""; el.removeAttribute("style"); }
    });
    clone.querySelector("#toast")?.classList.add("hidden");
    clone.querySelector("#pickedBar")?.classList.add("hidden");
    clone.querySelector("#settings")?.removeAttribute("open");
    clone.querySelector("#anchorDate")?.setAttribute("value", anchorISO);

    const sc = clone.querySelector("#mainScript");
    if (sc) sc.textContent = sc.textContent.replace(/const DEFAULT_ANCHOR = "\d{4}-\d{2}-\d{2}"; \/\/ __ANCHOR__/, `const DEFAULT_ANCHOR = "${anchorISO}"; // __ANCHOR__`);

    const blob = new Blob(["<!DOCTYPE html>\n" + clone.outerHTML], { type: "text/html;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `个人排班日历-${anchorISO}.html`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    showToast("已导出独立 HTML 文件");
  });

  $("copyAttendance").addEventListener("click", async () => {
    const textEl = $("attendanceText"), text = textEl.textContent;
    let ok = false;
    try {
      const area = document.createElement("textarea");
      area.value = text;
      area.style.cssText = "position:fixed;top:50%;left:50%;width:2px;height:2px;padding:0;border:0;outline:0;background:transparent;color:transparent;font-size:16px;z-index:-1;";
      document.body.appendChild(area);
      area.focus({ preventScroll: true });
      area.select();
      area.setSelectionRange(0, area.value.length);
      if (document.execCommand("copy")) ok = true;
      area.remove();
    } catch (_) {}
    try {
      const range = document.createRange();
      range.selectNodeContents(textEl);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      if (document.execCommand("copy")) ok = true;
      setTimeout(() => sel.removeAllRanges(), 300);
    } catch (_) {}
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        ok = true;
      }
    } catch (_) {}
    showToast(ok ? "考勤统计已复制到剪贴板" : "已为您全选文字，请点击弹出的【复制】");
  });

  loadSettings();
  renderAll();
})();
</script>
</body>
</html>
